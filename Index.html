<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse IPTV Player</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- HLS.js Library for HTTP Live Streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: {
                            base: '#0f172a',
                            surface: '#1e293b',
                            card: '#334155',
                            border: '#475569',
                            hover: '#3b82f6'
                        },
                        brand: {
                            primary: '#3b82f6',
                            accent: '#6366f1',
                            warning: '#f59e0b',
                            danger: '#ef4444'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar styling for dark theme */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        .aspect-video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            height: 0;
            overflow: hidden;
        }
        .aspect-video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="bg-dark-base text-slate-100 font-sans h-screen flex flex-col overflow-hidden select-none">

    <!-- Top Header -->
    <header class="bg-dark-surface border-b border-slate-800 px-4 py-2.5 flex items-center justify-between shrink-0 z-20">
        <div class="flex items-center space-x-3">
            <button id="toggle-sidebar" class="md:hidden text-slate-400 hover:text-white p-1 rounded">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-tv text-sm"></i>
                </div>
                <span class="font-bold text-lg tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">StreamPulse</span>
            </div>
            <span id="active-playlist-badge" class="hidden sm:inline-block px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-500/10 text-blue-400 border border-blue-500/20 max-w-[150px] truncate">
                Demo Streams
            </span>
        </div>

        <div class="flex items-center space-x-2">
            <!-- CORS Proxy Toggle -->
            <button id="cors-toggle-btn" title="Toggle CORS Proxy (Enable if streams fail to load due to browser security restrictions)" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 flex items-center space-x-1.5 transition">
                <span id="cors-indicator" class="w-2 h-2 rounded-full bg-slate-500"></span>
                <span>CORS Proxy</span>
            </button>

            <!-- Playlist Manager Button -->
            <button id="open-playlists-btn" class="px-3.5 py-1.5 rounded-lg text-xs font-medium bg-blue-600 hover:bg-blue-500 text-white shadow-md shadow-blue-600/20 flex items-center space-x-2 transition">
                <i class="fa-solid fa-list-ul"></i>
                <span class="hidden sm:inline">Playlists</span>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="flex flex-1 overflow-hidden relative">
        
        <!-- Left Sidebar: Categories & Search -->
        <aside id="sidebar" class="w-72 bg-dark-surface border-r border-slate-800 flex flex-col absolute md:relative inset-y-0 left-0 z-30 transform -translate-x-full md:translate-x-0 transition-transform duration-200 ease-in-out">
            <!-- Search Channel -->
            <div class="p-3 border-b border-slate-800">
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input type="text" id="channel-search" placeholder="Search channels..." class="w-full bg-slate-900 border border-slate-700/60 rounded-lg pl-9 pr-3 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
                </div>
            </div>

            <!-- Special Views (All, Favorites) -->
            <div class="px-2 py-2 border-b border-slate-800 space-y-1 text-xs">
                <button data-category="__ALL__" class="category-btn w-full flex items-center justify-between px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-800/80 active-cat font-medium transition">
                    <span class="flex items-center space-x-2.5">
                        <i class="fa-solid fa-[#000] fa-layer-group text-blue-400"></i>
                        <span>All Channels</span>
                    </span>
                    <span id="count-all" class="text-[10px] bg-slate-800 px-2 py-0.5 rounded-full text-slate-400">0</span>
                </button>
                <button data-category="__FAV__" class="category-btn w-full flex items-center justify-between px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-800/80 transition">
                    <span class="flex items-center space-x-2.5">
                        <i class="fa-solid fa-star text-amber-400"></i>
                        <span>Favorites</span>
                    </span>
                    <span id="count-fav" class="text-[10px] bg-slate-800 px-2 py-0.5 rounded-full text-slate-400">0</span>
                </button>
            </div>

            <!-- Dynamic Category List -->
            <div class="flex-1 overflow-y-auto p-2 space-y-0.5" id="category-list">
                <!-- Categories will be dynamically injected here -->
            </div>
        </aside>

        <!-- Sidebar Overlay for Mobile -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden backdrop-blur-sm"></div>

        <!-- Right Content: Video Player + Channel Grid -->
        <main class="flex-1 flex flex-col overflow-hidden bg-slate-950">
            
            <!-- Video Player Section -->
            <div class="bg-black relative border-b border-slate-800 flex-shrink-0">
                <div class="max-w-5xl mx-auto w-full">
                    <div class="aspect-video-container bg-slate-950 flex items-center justify-center group">
                        <video id="video-player" class="w-full h-full" controls crossorigin="anonymous" playsinline></video>
                        
                        <!-- Overlay Loading / Player Status -->
                        <div id="player-placeholder" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/90 p-6 text-center z-10">
                            <div id="player-spinner" class="hidden mb-3">
                                <i class="fa-solid fa-circle-notch fa-spin text-3xl text-blue-500"></i>
                            </div>
                            <i id="player-icon" class="fa-solid fa-play-circle text-5xl text-slate-700 mb-3"></i>
                            <h3 id="player-status-title" class="text-sm font-semibold text-slate-300">No Stream Playing</h3>
                            <p id="player-status-desc" class="text-xs text-slate-500 max-w-sm mt-1">Select a channel from the list below to begin streaming.</p>
                        </div>
                    </div>
                </div>

                <!-- Now Playing Info Bar -->
                <div class="px-4 py-2 bg-dark-surface/90 border-t border-slate-800/60 flex items-center justify-between text-xs">
                    <div class="flex items-center space-x-3 truncate mr-2">
                        <div id="now-playing-logo-bg" class="w-7 h-7 rounded bg-slate-800 flex items-center justify-center overflow-hidden shrink-0 border border-slate-700">
                            <img id="now-playing-logo" class="w-full h-full object-contain hidden" src="" alt="logo" onerror="this.classList.add('hidden')">
                            <i id="now-playing-icon" class="fa-solid fa-tv text-slate-500 text-xs"></i>
                        </div>
                        <div class="truncate">
                            <div id="now-playing-title" class="font-semibold text-slate-200 truncate">Select a channel</div>
                            <div id="now-playing-group" class="text-[10px] text-slate-400 truncate">IPTV Player</div>
                        </div>
                    </div>

                    <div class="flex items-center space-x-2 shrink-0">
                        <button id="toggle-favorite-btn" disabled class="p-1.5 text-slate-500 hover:text-amber-400 disabled:opacity-30 transition">
                            <i id="fav-icon" class="fa-regular fa-star text-base"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Channels Bar Header -->
            <div class="px-4 py-2 bg-dark-surface border-b border-slate-800 flex items-center justify-between shrink-0">
                <div class="flex items-center space-x-2">
                    <span id="current-category-label" class="font-semibold text-xs text-slate-200">All Channels</span>
                    <span id="channel-count-badge" class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 font-medium">0</span>
                </div>
                <div class="flex items-center space-x-1 bg-slate-900 p-0.5 rounded-lg border border-slate-800">
                    <button id="view-grid-btn" class="px-2 py-1 rounded text-xs text-blue-400 bg-slate-800" title="Grid View">
                        <i class="fa-solid fa-grip"></i>
                    </button>
                    <button id="view-list-btn" class="px-2 py-1 rounded text-xs text-slate-400 hover:text-white" title="List View">
                        <i class="fa-solid fa-list"></i>
                    </button>
                </div>
            </div>

            <!-- Channel Grid / List View -->
            <div class="flex-1 overflow-y-auto p-3 sm:p-4" id="channel-container">
                <div id="channel-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8 gap-2.5 sm:gap-3">
                    <!-- Dynamic Channels Injected Here -->
                </div>
            </div>

        </main>
    </div>

    <!-- PLAYLIST MANAGER MODAL -->
    <div id="playlist-modal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-xs flex items-center justify-center p-3 sm:p-4 hidden">
        <div class="bg-dark-surface border border-slate-800 rounded-xl max-w-lg w-full overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            
            <!-- Modal Header -->
            <div class="px-5 py-3.5 border-b border-slate-800 flex items-center justify-between">
                <h2 class="font-bold text-base text-white flex items-center space-x-2">
                    <i class="fa-solid fa-folder-plus text-blue-500"></i>
                    <span>Manage Playlists</span>
                </h2>
                <button id="close-modal-btn" class="text-slate-400 hover:text-white p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Modal Content (Tabs) -->
            <div class="flex-1 overflow-y-auto p-5">
                
                <!-- Tab Controls -->
                <div class="flex border-b border-slate-800 mb-4 space-x-4 text-xs font-medium">
                    <button id="tab-btn-xtream" class="pb-2 border-b-2 border-blue-500 text-blue-400">Xtream Codes</button>
                    <button id="tab-btn-m3u-url" class="pb-2 border-b-2 border-transparent text-slate-400 hover:text-slate-200">M3U URL</button>
                    <button id="tab-btn-m3u-file" class="pb-2 border-b-2 border-transparent text-slate-400 hover:text-slate-200">File Upload</button>
                    <button id="tab-btn-saved" class="pb-2 border-b-2 border-transparent text-slate-400 hover:text-slate-200">Saved Playlists</button>
                </div>

                <!-- Form 1: Xtream Codes API (Matching Screenshot UI) -->
                <form id="form-xtream" class="space-y-3.5">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Playlist name</label>
                        <input type="text" id="xtream-name" placeholder="My Xtream IPTV" required class="w-full bg-slate-900 border border-slate-700/70 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Username</label>
                        <input type="text" id="xtream-user" placeholder="Enter username" required class="w-full bg-slate-900 border border-slate-700/70 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Password</label>
                        <input type="password" id="xtream-pass" placeholder="Enter password" required class="w-full bg-slate-900 border border-slate-700/70 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Server address</label>
                        <input type="text" id="xtream-host" placeholder="http://example.com:8080" required class="w-full bg-slate-900 border border-slate-700/70 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                        <p class="text-[10px] text-slate-500 mt-1">Provide server address (should start with "http://" or "https://").</p>
                    </div>
                    <div class="flex items-center space-x-2 pt-1">
                        <input type="checkbox" id="xtream-ua" checked class="rounded border-slate-700 text-blue-600 focus:ring-0">
                        <label for="xtream-ua" class="text-xs text-slate-300">Use default User-Agent</label>
                    </div>

                    <button type="submit" class="w-full py-2.5 mt-2 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg text-xs transition shadow-md shadow-blue-600/20">
                        Add Xtream Playlist
                    </button>
                </form>

                <!-- Form 2: M3U / M3U8 URL -->
                <form id="form-m3u-url" class="space-y-3.5 hidden">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Playlist Name</label>
                        <input type="text" id="m3u-url-name" placeholder="My M3U Stream List" required class="w-full bg-slate-900 border border-slate-700/70 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">M3U / M3U8 Playlist URL</label>
                        <input type="url" id="m3u-url-val" placeholder="https://example.com/playlist.m3u" required class="w-full bg-slate-900 border border-slate-700/70 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg text-xs transition shadow-md shadow-blue-600/20">
                        Fetch & Add Playlist
                    </button>
                </form>

                <!-- Form 3: File Upload -->
                <form id="form-m3u-file" class="space-y-3.5 hidden">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Playlist Name</label>
                        <input type="text" id="m3u-file-name" placeholder="Local IPTV File" class="w-full bg-slate-900 border border-slate-700/70 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Select .m3u or .m3u8 File</label>
                        <input type="file" id="m3u-file-input" accept=".m3u,.m3u8,.txt" required class="w-full bg-slate-900 border border-slate-700/70 rounded-lg px-3 py-2 text-xs text-slate-300 file:mr-3 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:bg-slate-800 file:text-blue-400 hover:file:bg-slate-700">
                    </div>
                    <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg text-xs transition shadow-md shadow-blue-600/20">
                        Parse File & Save
                    </button>
                </form>

                <!-- View 4: Saved Playlists -->
                <div id="view-saved-playlists" class="space-y-2 hidden">
                    <div id="saved-playlists-list" class="space-y-2">
                        <!-- Rendered dynamically -->
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        /**
         * StreamPulse IPTV Core Application
         */
        
        // --- Sample Preset Channels for instant user demo ---
        const PRESET_CHANNELS = [
            {
                id: 'preset-1',
                name: 'NASA TV Public',
                logo: 'https://www.nasa.gov/wp-content/themes/nasa/assets/images/nasa-logo.svg',
                group: 'Science & Space',
                url: 'https://nasa-vh.akamaihd.net/i/nasa_1@315469/master.m3u8'
            },
            {
                id: 'preset-2',
                name: 'Red Bull TV',
                logo: 'https://images.fineartamerica.com/images/artworkimages/mediumlarge/3/red-bull-logo-transparent-png-svg-vector-dora-a-art.png',
                group: 'Sports & Adventure',
                url: 'https://rbmn-live.akamaized.net/hls/live/590920/geo-blocked/master.m3u8'
            },
            {
                id: 'preset-3',
                name: 'Bloomberg Television',
                logo: 'https://assets.bwbx.io/images/users/iqj6y05GE244/ikd5E51S2uD0/v0/1200x-1.png',
                group: 'News & Finance',
                url: 'https://live-bloomberg-us.akamaized.net/hls/live/2037704/bloomberg_us/master.m3u8'
            },
            {
                id: 'preset-4',
                name: 'DW English Live',
                logo: 'https://upload.wikimedia.org/wikipedia/commons/thumb/7/75/Deutsche_Welle_logo.svg/1200px-Deutsche_Welle_logo.svg.png',
                group: 'News & Finance',
                url: 'https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8'
            },
            {
                id: 'preset-5',
                name: 'Al Jazeera English',
                logo: 'https://upload.wikimedia.org/wikipedia/en/7/78/Al_Jazeera_English_logo.svg',
                group: 'News & Finance',
                url: 'https://live-hls-web-aje.getaj.net/AJE/index.m3u8'
            },
            {
                id: 'preset-6',
                name: 'France 24 English',
                logo: 'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/France_24_logo.svg/1200px-France_24_logo.svg.png',
                group: 'News & Finance',
                url: 'https://static.france24.com/live/F24_EN_LO_HLS/live_tv.m3u8'
            }
        ];

        // --- App State ---
        const state = {
            playlists: [],
            activePlaylistId: 'preset',
            channels: [],
            filteredChannels: [],
            categories: new Set(),
            activeCategory: '__ALL__',
            currentChannel: null,
            favorites: new Set(),
            viewMode: 'grid', // 'grid' | 'list'
            useCorsProxy: false,
            corsProxyPrefix: 'https://corsproxy.io/?'
        };

        // --- DOM Elements ---
        const el = {
            videoPlayer: document.getElementById('video-player'),
            playerPlaceholder: document.getElementById('player-placeholder'),
            playerSpinner: document.getElementById('player-spinner'),
            playerIcon: document.getElementById('player-icon'),
            playerStatusTitle: document.getElementById('player-status-title'),
            playerStatusDesc: document.getElementById('player-status-desc'),
            
            sidebar: document.getElementById('sidebar'),
            sidebarOverlay: document.getElementById('sidebar-overlay'),
            toggleSidebarBtn: document.getElementById('toggle-sidebar'),
            
            categoryList: document.getElementById('category-list'),
            channelGrid: document.getElementById('channel-grid'),
            channelSearch: document.getElementById('channel-search'),
            currentCatLabel: document.getElementById('current-category-label'),
            channelCountBadge: document.getElementById('channel-count-badge'),
            countAll: document.getElementById('count-all'),
            countFav: document.getElementById('count-fav'),
            
            playlistModal: document.getElementById('playlist-modal'),
            openPlaylistsBtn: document.getElementById('open-playlists-btn'),
            closeModalBtn: document.getElementById('close-modal-btn'),
            activePlaylistBadge: document.getElementById('active-playlist-badge'),
            
            corsToggleBtn: document.getElementById('cors-toggle-btn'),
            corsIndicator: document.getElementById('cors-indicator'),
            
            nowPlayingTitle: document.getElementById('now-playing-title'),
            nowPlayingGroup: document.getElementById('now-playing-group'),
            nowPlayingLogo: document.getElementById('now-playing-logo'),
            nowPlayingLogoBg: document.getElementById('now-playing-logo-bg'),
            nowPlayingIcon: document.getElementById('now-playing-icon'),
            toggleFavoriteBtn: document.getElementById('toggle-favorite-btn'),
            favIcon: document.getElementById('fav-icon'),
            
            viewGridBtn: document.getElementById('view-grid-btn'),
            viewListBtn: document.getElementById('view-list-btn'),
            
            // Forms & Tabs
            tabXtream: document.getElementById('tab-btn-xtream'),
            tabM3uUrl: document.getElementById('tab-btn-m3u-url'),
            tabM3uFile: document.getElementById('tab-btn-m3u-file'),
            tabSaved: document.getElementById('tab-btn-saved'),
            
            formXtream: document.getElementById('form-xtream'),
            formM3uUrl: document.getElementById('form-m3u-url'),
            formM3uFile: document.getElementById('form-m3u-file'),
            viewSavedPlaylists: document.getElementById('view-saved-playlists'),
            savedPlaylistsList: document.getElementById('saved-playlists-list')
        };

        let hlsInstance = null;

        // --- Initialization ---
        window.addEventListener('DOMContentLoaded', () => {
            loadFavoritesFromStorage();
            loadSavedPlaylists();
            setupEventListeners();
            loadPresetChannels();
        });

        function setupEventListeners() {
            // Sidebar Mobile Toggle
            el.toggleSidebarBtn.addEventListener('click', toggleSidebar);
            el.sidebarOverlay.addEventListener('click', toggleSidebar);

            // Modal Controls
            el.openPlaylistsBtn.addEventListener('click', () => el.playlistModal.classList.remove('hidden'));
            el.closeModalBtn.addEventListener('click', () => el.playlistModal.classList.add('hidden'));

            // Tab Controls inside Modal
            el.tabXtream.addEventListener('click', () => switchTab('xtream'));
            el.tabM3uUrl.addEventListener('click', () => switchTab('m3u-url'));
            el.tabM3uFile.addEventListener('click', () => switchTab('m3u-file'));
            el.tabSaved.addEventListener('click', () => switchTab('saved'));

            // CORS Proxy Toggle
            el.corsToggleBtn.addEventListener('click', () => {
                state.useCorsProxy = !state.useCorsProxy;
                el.corsIndicator.className = state.useCorsProxy ? 'w-2 h-2 rounded-full bg-emerald-500 shadow-sm shadow-emerald-500' : 'w-2 h-2 rounded-full bg-slate-500';
                showNotification(state.useCorsProxy ? 'CORS Proxy Enabled' : 'CORS Proxy Disabled');
                if (state.currentChannel) {
                    playChannel(state.currentChannel);
                }
            });

            // Form Submissions
            el.formXtream.addEventListener('submit', handleXtreamSubmit);
            el.formM3uUrl.addEventListener('submit', handleM3uUrlSubmit);
            el.formM3uFile.addEventListener('submit', handleM3uFileSubmit);

            // Channel Search
            el.channelSearch.addEventListener('input', (e) => {
                filterAndRenderChannels(e.target.value);
            });

            // Views Layout Toggle
            el.viewGridBtn.addEventListener('click', () => setViewMode('grid'));
            el.viewListBtn.addEventListener('click', () => setViewMode('list'));

            // Category Click Handler (Delegation)
            el.categoryList.addEventListener('click', (e) => {
                const catBtn = e.target.closest('.category-btn');
                if (catBtn) {
                    const category = catBtn.dataset.category;
                    setActiveCategory(category);
                }
            });
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', () => setActiveCategory(btn.dataset.category));
            });

            // Toggle Favorite Channel
            el.toggleFavoriteBtn.addEventListener('click', () => {
                if (!state.currentChannel) return;
                const id = state.currentChannel.id;
                if (state.favorites.has(id)) {
                    state.favorites.delete(id);
                } else {
                    state.favorites.add(id);
                }
                saveFavoritesToStorage();
                updateFavoriteBtnState();
                updateCategoryCounts();
                if (state.activeCategory === '__FAV__') {
                    filterAndRenderChannels();
                }
            });
        }

        function toggleSidebar() {
            el.sidebar.classList.toggle('-translate-x-full');
            el.sidebarOverlay.classList.toggle('hidden');
        }

        function setViewMode(mode) {
            state.viewMode = mode;
            if (mode === 'grid') {
                el.viewGridBtn.className = 'px-2 py-1 rounded text-xs text-blue-400 bg-slate-800';
                el.viewListBtn.className = 'px-2 py-1 rounded text-xs text-slate-400 hover:text-white';
                el.channelGrid.className = 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8 gap-2.5 sm:gap-3';
            } else {
                el.viewListBtn.className = 'px-2 py-1 rounded text-xs text-blue-400 bg-slate-800';
                el.viewGridBtn.className = 'px-2 py-1 rounded text-xs text-slate-400 hover:text-white';
                el.channelGrid.className = 'flex flex-col space-y-2';
            }
            renderChannels(state.filteredChannels);
        }

        // --- Preset Channels Loader ---
        function loadPresetChannels() {
            state.channels = PRESET_CHANNELS;
            state.activePlaylistId = 'preset';
            el.activePlaylistBadge.textContent = 'Demo Streams';
            processLoadedChannels();
        }

        // --- M3U / M3U8 Parser ---
        function parseM3U(content) {
            const lines = content.split(/\r?\n/);
            const channels = [];
            let currentChannel = null;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();

                if (line.startsWith('#EXTINF:')) {
                    currentChannel = {};
                    
                    // Extract tvg-logo
                    const logoMatch = line.match(/tvg-logo="([^"]*)"/i);
                    if (logoMatch) currentChannel.logo = logoMatch[1];

                    // Extract group-title
                    const groupMatch = line.match(/group-title="([^"]*)"/i);
                    currentChannel.group = groupMatch ? groupMatch[1] : 'Uncategorized';

                    // Extract channel name (after last comma)
                    const commaIndex = line.lastIndexOf(',');
                    if (commaIndex !== -1) {
                        currentChannel.name = line.substring(commaIndex + 1).trim();
                    } else {
                        currentChannel.name = 'Channel ' + (channels.length + 1);
                    }

                    currentChannel.id = 'm3u-' + Math.random().toString(36).substring(2, 9);
                } else if (line.length > 0 && !line.startsWith('#') && currentChannel) {
                    currentChannel.url = line;
                    channels.push(currentChannel);
                    currentChannel = null;
                }
            }
            return channels;
        }

        // --- Xtream Codes API Handler ---
        async function handleXtreamSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('xtream-name').value.trim();
            const username = document.getElementById('xtream-user').value.trim();
            const password = document.getElementById('xtream-pass').value.trim();
            let server = document.getElementById('xtream-host').value.trim();

            if (!server.startsWith('http://') && !server.startsWith('https://')) {
                server = 'http://' + server;
            }
            // Remove trailing slashes
            server = server.replace(/\/+$|\/player_api\.php/g, "");

            showLoadingPlaceholder('Connecting to Xtream Server...');
            el.playlistModal.classList.add('hidden');

            try {
                // Fetch Categories
                const catUrl = `${server}/player_api.php?username=${username}&password=${password}&action=get_live_categories`;
                const finalCatUrl = state.useCorsProxy ? state.corsProxyPrefix + encodeURIComponent(catUrl) : catUrl;
                
                const catRes = await fetch(finalCatUrl);
                const categories = await catRes.json();

                const catMap = {};
                if (Array.isArray(categories)) {
                    categories.forEach(c => catMap[c.category_id] = c.category_name);
                }

                // Fetch Live Streams
                const streamUrl = `${server}/player_api.php?username=${username}&password=${password}&action=get_live_streams`;
                const finalStreamUrl = state.useCorsProxy ? state.corsProxyPrefix + encodeURIComponent(streamUrl) : streamUrl;

                const streamRes = await fetch(finalStreamUrl);
                const streams = await streamRes.json();

                if (!Array.isArray(streams)) {
                    throw new Error('Invalid authentication or empty stream payload');
                }

                const parsedChannels = streams.map(s => ({
                    id: 'xtream-' + s.stream_id,
                    name: s.name,
                    logo: s.stream_icon || '',
                    group: catMap[s.category_id] || 'General',
                    url: `${server}/live/${username}/${password}/${s.stream_id}.m3u8`
                }));

                const newPlaylist = {
                    id: 'pl-' + Date.now(),
                    name: name,
                    type: 'xtream',
                    channels: parsedChannels
                };

                savePlaylist(newPlaylist);
                activatePlaylist(newPlaylist);

                showNotification(`Loaded ${parsedChannels.length} streams from ${name}`);
            } catch (err) {
                console.error(err);
                alert(`Xtream API Error: ${err.message}. If CORS issue occurs, try toggling CORS Proxy on top right.`);
                hideLoadingPlaceholder();
            }
        }

        // --- M3U URL Submit ---
        async function handleM3uUrlSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('m3u-url-name').value.trim();
            const url = document.getElementById('m3u-url-val').value.trim();

            showLoadingPlaceholder('Fetching M3U Playlist...');
            el.playlistModal.classList.add('hidden');

            try {
                const fetchUrl = state.useCorsProxy ? state.corsProxyPrefix + encodeURIComponent(url) : url;
                const res = await fetch(fetchUrl);
                const content = await res.text();
                
                const parsedChannels = parseM3U(content);
                if (parsedChannels.length === 0) {
                    throw new Error('No valid streams found in M3U file.');
                }

                const newPlaylist = {
                    id: 'pl-' + Date.now(),
                    name: name,
                    type: 'm3u-url',
                    channels: parsedChannels
                };

                savePlaylist(newPlaylist);
                activatePlaylist(newPlaylist);
                showNotification(`Loaded ${parsedChannels.length} channels.`);
            } catch (err) {
                console.error(err);
                alert(`Error loading M3U URL: ${err.message}`);
                hideLoadingPlaceholder();
            }
        }

        // --- M3U File Submit ---
        function handleM3uFileSubmit(e) {
            e.preventDefault();
            const nameInput = document.getElementById('m3u-file-name').value.trim();
            const fileInput = document.getElementById('m3u-file-input');

            if (!fileInput.files || fileInput.files.length === 0) return;

            const file = fileInput.files[0];
            const name = nameInput || file.name.replace(/\.[^/.]+$/, "");

            const reader = new FileReader();
            reader.onload = function(evt) {
                const content = evt.target.result;
                const parsedChannels = parseM3U(content);

                if (parsedChannels.length === 0) {
                    alert('Could not parse channels from selected file.');
                    return;
                }

                const newPlaylist = {
                    id: 'pl-' + Date.now(),
                    name: name,
                    type: 'm3u-file',
                    channels: parsedChannels
                };

                savePlaylist(newPlaylist);
                activatePlaylist(newPlaylist);
                el.playlistModal.classList.add('hidden');
                showNotification(`Loaded ${parsedChannels.length} channels from file.`);
            };
            reader.readAsText(file);
        }

        // --- Playlist Management Logic ---
        function savePlaylist(playlist) {
            state.playlists.push(playlist);
            try {
                localStorage.setItem('stream_pulse_playlists', JSON.stringify(state.playlists));
            } catch (e) {
                console.warn('LocalStorage payload limit exceeded', e);
            }
            renderSavedPlaylistsList();
        }

        function loadSavedPlaylists() {
            try {
                const stored = localStorage.getItem('stream_pulse_playlists');
                if (stored) {
                    state.playlists = JSON.parse(stored);
                    renderSavedPlaylistsList();
                }
            } catch (e) {
                console.error('Failed to load saved playlists', e);
            }
        }

        function activatePlaylist(playlist) {
            state.activePlaylistId = playlist.id;
            state.channels = playlist.channels;
            el.activePlaylistBadge.textContent = playlist.name;
            processLoadedChannels();
        }

        function deletePlaylist(id) {
            state.playlists = state.playlists.filter(p => p.id !== id);
            try {
                localStorage.setItem('stream_pulse_playlists', JSON.stringify(state.playlists));
            } catch (e) {}
            renderSavedPlaylistsList();

            if (state.activePlaylistId === id) {
                loadPresetChannels();
            }
        }

        function renderSavedPlaylistsList() {
            el.savedPlaylistsList.innerHTML = '';
            
            // Default Preset Option
            const presetItem = document.createElement('div');
            presetItem.className = `p-3 rounded-lg border flex items-center justify-between text-xs ${state.activePlaylistId === 'preset' ? 'border-blue-500/50 bg-blue-500/10' : 'border-slate-800 bg-slate-900'}`;
            presetItem.innerHTML = `
                <div>
                    <div class="font-semibold text-white">Demo Streams (Preset)</div>
                    <div class="text-[10px] text-slate-400">${PRESET_CHANNELS.length} sample streams</div>
                </div>
                <button class="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-blue-400 font-medium transition" onclick="loadPresetChannels(); el.playlistModal.classList.add('hidden');">Select</button>
            `;
            el.savedPlaylistsList.appendChild(presetItem);

            state.playlists.forEach(pl => {
                const item = document.createElement('div');
                item.className = `p-3 rounded-lg border flex items-center justify-between text-xs ${state.activePlaylistId === pl.id ? 'border-blue-500/50 bg-blue-500/10' : 'border-slate-800 bg-slate-900'}`;
                item.innerHTML = `
                    <div class="truncate mr-2">
                        <div class="font-semibold text-white truncate">${pl.name}</div>
                        <div class="text-[10px] text-slate-400 uppercase tracking-wider">${pl.type} • ${pl.channels.length} channels</div>
                    </div>
                    <div class="flex items-center space-x-1 shrink-0">
                        <button class="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-blue-400 font-medium transition" onclick="activateSavedPlaylist('${pl.id}')">Select</button>
                        <button class="p-1.5 text-slate-500 hover:text-red-400 transition" onclick="deletePlaylist('${pl.id}')"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                el.savedPlaylistsList.appendChild(item);
            });
        }

        window.activateSavedPlaylist = function(id) {
            const pl = state.playlists.find(p => p.id === id);
            if (pl) {
                activatePlaylist(pl);
                el.playlistModal.classList.add('hidden');
            }
        };

        // --- Channel Category & Filter Pipeline ---
        function processLoadedChannels() {
            state.categories.clear();
            state.channels.forEach(ch => {
                if (ch.group) state.categories.add(ch.group);
            });
            
            renderCategoryList();
            setActiveCategory('__ALL__');
            updateCategoryCounts();
        }

        function renderCategoryList() {
            // Remove previous dynamically generated items (keep All and Fav)
            const dynamicItems = el.categoryList.querySelectorAll('.dynamic-cat');
            dynamicItems.forEach(item => item.remove());

            Array.from(state.categories).sort().forEach(cat => {
                const count = state.channels.filter(c => c.group === cat).length;
                const btn = document.createElement('button');
                btn.dataset.category = cat;
                btn.className = 'category-btn dynamic-cat w-full flex items-center justify-between px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-800/80 text-xs transition';
                btn.innerHTML = `
                    <span class="truncate mr-2 flex items-center space-x-2.5">
                        <i class="fa-regular fa-folder text-slate-400"></i>
                        <span class="truncate">${cat}</span>
                    </span>
                    <span class="text-[10px] bg-slate-800/80 px-2 py-0.5 rounded-full text-slate-400 shrink-0">${count}</span>
                `;
                el.categoryList.appendChild(btn);
            });
        }

        function setActiveCategory(category) {
            state.activeCategory = category;
            
            // Highlight active button
            document.querySelectorAll('.category-btn').forEach(btn => {
                if (btn.dataset.category === category) {
                    btn.classList.add('bg-blue-600/20', 'text-blue-400', 'font-medium');
                } else {
                    btn.classList.remove('bg-blue-600/20', 'text-blue-400', 'font-medium');
                }
            });

            // Update Header Label
            if (category === '__ALL__') el.currentCatLabel.textContent = 'All Channels';
            else if (category === '__FAV__') el.currentCatLabel.textContent = 'Favorite Channels';
            else el.currentCatLabel.textContent = category;

            filterAndRenderChannels(el.channelSearch.value);
        }

        function filterAndRenderChannels(searchQuery = '') {
            let filtered = state.channels;

            // Apply category filter
            if (state.activeCategory === '__FAV__') {
                filtered = filtered.filter(ch => state.favorites.has(ch.id));
            } else if (state.activeCategory !== '__ALL__') {
                filtered = filtered.filter(ch => ch.group === state.activeCategory);
            }

            // Apply search filter
            if (searchQuery.trim() !== '') {
                const q = searchQuery.toLowerCase();
                filtered = filtered.filter(ch => ch.name.toLowerCase().includes(q));
            }

            state.filteredChannels = filtered;
            el.channelCountBadge.textContent = filtered.length;
            renderChannels(filtered);
        }

        function updateCategoryCounts() {
            el.countAll.textContent = state.channels.length;
            el.countFav.textContent = state.favorites.size;
        }

        // --- Channel Grid Rendering ---
        function renderChannels(channels) {
            el.channelGrid.innerHTML = '';

            if (channels.length === 0) {
                el.channelGrid.innerHTML = `
                    <div class="col-span-full py-12 flex flex-col items-center justify-center text-center text-slate-500">
                        <i class="fa-solid fa-tv text-4xl mb-2 text-slate-700"></i>
                        <p class="text-sm font-medium">No channels found</p>
                        <p class="text-xs">Try selecting a different category or clear search filter.</p>
                    </div>
                `;
                return;
            }

            channels.forEach(ch => {
                const isActive = state.currentChannel && state.currentChannel.id === ch.id;
                const isFav = state.favorites.has(ch.id);

                const card = document.createElement('div');
                
                if (state.viewMode === 'grid') {
                    card.className = `group relative bg-slate-900 border ${isActive ? 'border-blue-500 ring-2 ring-blue-500/20' : 'border-slate-800/80 hover:border-slate-700'} rounded-xl p-3 flex flex-col items-center text-center cursor-pointer transition transform active:scale-95`;
                    card.innerHTML = `
                        <button class="fav-quick-toggle absolute top-2 right-2 text-xs ${isFav ? 'text-amber-400' : 'text-slate-600 opacity-0 group-hover:opacity-100'} hover:scale-110 transition" data-id="${ch.id}">
                            <i class="${isFav ? 'fa-solid' : 'fa-regular'} fa-star"></i>
                        </button>
                        <div class="w-12 h-12 rounded-lg bg-slate-950 flex items-center justify-center overflow-hidden my-1 border border-slate-800 group-hover:border-slate-700">
                            ${ch.logo ? `<img src="${ch.logo}" alt="" class="w-full h-full object-contain p-1" onerror="this.outerHTML='<i class=\\'fa-solid fa-tv text-slate-600 text-lg\\'></i>'">` : `<i class="fa-solid fa-tv text-slate-600 text-lg"></i>`}
                        </div>
                        <div class="w-full mt-2">
                            <h4 class="font-semibold text-xs text-slate-200 truncate group-hover:text-blue-400 transition">${ch.name}</h4>
                            <p class="text-[10px] text-slate-500 truncate mt-0.5">${ch.group || 'IPTV'}</p>
                        </div>
                    `;
                } else {
                    card.className = `group bg-slate-900 border ${isActive ? 'border-blue-500 ring-1 ring-blue-500/20' : 'border-slate-800/80 hover:border-slate-700'} rounded-lg p-2.5 flex items-center justify-between cursor-pointer transition`;
                    card.innerHTML = `
                        <div class="flex items-center space-x-3 truncate">
                            <div class="w-8 h-8 rounded bg-slate-950 flex items-center justify-center overflow-hidden shrink-0 border border-slate-800">
                                ${ch.logo ? `<img src="${ch.logo}" alt="" class="w-full h-full object-contain p-0.5" onerror="this.outerHTML='<i class=\\'fa-solid fa-tv text-slate-600 text-xs\\'></i>'">` : `<i class="fa-solid fa-tv text-slate-600 text-xs"></i>`}
                            </div>
                            <div class="truncate">
                                <h4 class="font-semibold text-xs text-slate-200 truncate group-hover:text-blue-400 transition">${ch.name}</h4>
                                <p class="text-[10px] text-slate-500 truncate">${ch.group || 'IPTV'}</p>
                            </div>
                        </div>
                        <button class="fav-quick-toggle p-1 text-xs ${isFav ? 'text-amber-400' : 'text-slate-600'} hover:text-amber-400 transition" data-id="${ch.id}">
                            <i class="${isFav ? 'fa-solid' : 'fa-regular'} fa-star"></i>
                        </button>
                    `;
                }

                card.addEventListener('click', (e) => {
                    if (e.target.closest('.fav-quick-toggle')) {
                        e.stopPropagation();
                        if (state.favorites.has(ch.id)) state.favorites.delete(ch.id);
                        else state.favorites.add(ch.id);
                        saveFavoritesToStorage();
                        updateCategoryCounts();
                        renderChannels(state.filteredChannels);
                        if (state.currentChannel && state.currentChannel.id === ch.id) {
                            updateFavoriteBtnState();
                        }
                        return;
                    }
                    playChannel(ch);
                });

                el.channelGrid.appendChild(card);
            });
        }

        // --- Video Stream Playback Core ---
        function playChannel(channel) {
            state.currentChannel = channel;
            
            // Update Now Playing UI
            el.nowPlayingTitle.textContent = channel.name;
            el.nowPlayingGroup.textContent = channel.group || 'Live Stream';
            el.toggleFavoriteBtn.disabled = false;
            updateFavoriteBtnState();

            if (channel.logo) {
                el.nowPlayingLogo.src = channel.logo;
                el.nowPlayingLogo.classList.remove('hidden');
                el.nowPlayingIcon.classList.add('hidden');
            } else {
                el.nowPlayingLogo.classList.add('hidden');
                el.nowPlayingIcon.classList.remove('hidden');
            }

            // Re-render channel selection highlight
            renderChannels(state.filteredChannels);

            let streamUrl = channel.url;
            if (state.useCorsProxy) {
                streamUrl = state.corsProxyPrefix + encodeURIComponent(streamUrl);
            }

            showLoadingPlaceholder(`Loading ${channel.name}...`);

            // Destroy existing HLS instance
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            const video = el.videoPlayer;

            if (Hls.isSupported() && (streamUrl.includes('.m3u8') || streamUrl.includes('/live/'))) {
                hlsInstance = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true
                });
                
                hlsInstance.loadSource(streamUrl);
                hlsInstance.attachMedia(video);
                
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    hideLoadingPlaceholder();
                    video.play().catch(e => console.warn('Autoplay prevented', e));
                });

                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                showPlayerError('Network Error: Stream URL could not be fetched. Enable CORS Proxy or verify server availability.');
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hlsInstance.recoverMediaError();
                                break;
                            default:
                                hlsInstance.destroy();
                                showPlayerError('Playback Error: Stream format not supported or expired.');
                                break;
                        }
                    }
                });
            } 
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Native Safari HLS Support
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', () => {
                    hideLoadingPlaceholder();
                    video.play();
                });
            } 
            else {
                // Direct mp4 / raw stream fallbacks
                video.src = streamUrl;
                video.play().then(() => hideLoadingPlaceholder()).catch(err => {
                    showPlayerError('Error starting video playback.');
                });
            }
        }

        // --- UI State Helpers ---
        function showLoadingPlaceholder(message) {
            el.playerPlaceholder.classList.remove('hidden');
            el.playerSpinner.classList.remove('hidden');
            el.playerIcon.classList.add('hidden');
            el.playerStatusTitle.textContent = message;
            el.playerStatusDesc.textContent = 'Please wait while stream buffers...';
        }

        function hideLoadingPlaceholder() {
            el.playerPlaceholder.classList.add('hidden');
        }

        function showPlayerError(message) {
            el.playerPlaceholder.classList.remove('hidden');
            el.playerSpinner.classList.add('hidden');
            el.playerIcon.className = 'fa-solid fa-triangle-exclamation text-5xl text-red-500 mb-3';
            el.playerStatusTitle.textContent = 'Playback Failed';
            el.playerStatusDesc.textContent = message;
        }

        function updateFavoriteBtnState() {
            if (!state.currentChannel) return;
            const isFav = state.favorites.has(state.currentChannel.id);
            if (isFav) {
                el.favIcon.className = 'fa-solid fa-star text-amber-400 text-base';
            } else {
                el.favIcon.className = 'fa-regular fa-star text-slate-400 text-base';
            }
        }

        function switchTab(tab) {
            const tabs = ['xtream', 'm3u-url', 'm3u-file', 'saved'];
            tabs.forEach(t => {
                const btn = document.getElementById(`tab-btn-${t}`);
                const form = t === 'saved' ? el.viewSavedPlaylists : document.getElementById(`form-${t}`);
                
                if (t === tab) {
                    btn.className = 'pb-2 border-b-2 border-blue-500 text-blue-400 font-medium';
                    form.classList.remove('hidden');
                } else {
                    btn.className = 'pb-2 border-b-2 border-transparent text-slate-400 hover:text-slate-200';
                    form.classList.add('hidden');
                }
            });
        }

        function loadFavoritesFromStorage() {
            try {
                const favs = localStorage.getItem('stream_pulse_favorites');
                if (favs) {
                    state.favorites = new Set(JSON.parse(favs));
                }
            } catch (e) {}
        }

        function saveFavoritesToStorage() {
            try {
                localStorage.setItem('stream_pulse_favorites', JSON.stringify(Array.from(state.favorites)));
            } catch (e) {}
        }

        function showNotification(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-4 right-4 z-50 bg-blue-600 text-white px-4 py-2 rounded-lg text-xs font-semibold shadow-xl transition transform duration-300 translate-y-2 opacity-0';
            toast.textContent = msg;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
