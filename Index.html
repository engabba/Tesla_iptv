<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse IPTV Player</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HLS.js for stream playback -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CryptoJS for secure encryption -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .aspect-video-container { position: relative; padding-bottom: 56.25%; height: 0; }
        .aspect-video-container video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-tv text-indigo-500 text-2xl"></i>
            <h1 class="font-bold text-lg tracking-wide bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
                StreamPulse
            </h1>
        </div>
        <div class="flex items-center space-x-2">
            <!-- CORS Proxy Toggle -->
            <button id="proxyBtn" onclick="toggleProxy()" class="px-2.5 py-1 text-xs font-semibold rounded-md border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
                <i class="fa-solid fa-shield-halved text-emerald-400 mr-1"></i> Proxy: <span id="proxyStatus">Direct</span>
            </button>
            <!-- Settings / Playlist Manager Modal Trigger -->
            <button onclick="openModal('playlistModal')" class="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition">
                <i class="fa-solid fa-list-ul"></i>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="flex-1 flex flex-col lg:flex-row overflow-hidden">
        
        <!-- Left Side: Player & Info -->
        <div class="w-full lg:w-3/5 flex flex-col bg-slate-950 border-r border-slate-800">
            <!-- Video Container -->
            <div class="bg-black aspect-video-container relative group">
                <video id="videoPlayer" class="w-full h-full" controls autoplay playsinline></video>
                <div id="playerOverlay" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/80 p-4 text-center z-10">
                    <i id="playerIcon" class="fa-solid fa-play-circle text-5xl text-indigo-500 mb-3 animate-pulse"></i>
                    <p id="playerStatus" class="text-sm font-medium text-slate-300">Select a channel or load a playlist to begin</p>
                </div>
            </div>

            <!-- Current Stream Info Bar -->
            <div class="p-4 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
                <div>
                    <h2 id="currentChannelName" class="font-bold text-slate-100 truncate">No Channel Selected</h2>
                    <p id="currentChannelCategory" class="text-xs text-slate-400">IPTV Live Stream</p>
                </div>
                <button id="favCurrentBtn" onclick="toggleFavoriteCurrent()" class="text-slate-600 hover:text-amber-400 text-xl transition">
                    <i class="fa-star fa-regular"></i>
                </button>
            </div>

            <!-- Status Logs / Errors -->
            <div id="errorLog" class="hidden m-4 p-3 bg-red-950/50 border border-red-800/60 rounded-lg text-red-200 text-xs">
                <div class="flex items-start space-x-2">
                    <i class="fa-solid fa-circle-exclamation text-red-400 mt-0.5"></i>
                    <div id="errorMessage">Error details will appear here.</div>
                </div>
            </div>
        </div>

        <!-- Right Side: Channel List & Controls -->
        <div class="w-full lg:w-2/5 flex flex-col bg-slate-900 flex-1 overflow-hidden">
            
            <!-- Search & Filters -->
            <div class="p-3 bg-slate-900 border-b border-slate-800 flex flex-col space-y-2">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-500 text-xs"></i>
                    <input type="text" id="searchInput" oninput="filterChannels()" placeholder="Search channels..." class="w-full pl-8 pr-3 py-1.5 bg-slate-950 border border-slate-800 rounded-lg text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
                
                <div class="flex items-center space-x-2">
                    <select id="categorySelect" onchange="filterChannels()" class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-2 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-indigo-500">
                        <option value="ALL">All Categories</option>
                        <option value="FAV">Favorites Only</option>
                    </select>
                    <span id="channelCount" class="text-[10px] text-slate-400 whitespace-nowrap px-2">0 Channels</span>
                </div>
            </div>

            <!-- Channel Grid Container -->
            <div id="channelGrid" class="flex-1 overflow-y-auto p-3 grid grid-cols-1 sm:grid-cols-2 gap-2">
                <!-- Dynamic Channels Render Here -->
            </div>

            <!-- Pagination Bar -->
            <div class="p-3 bg-slate-900 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
                <button id="prevPageBtn" onclick="changePage(-1)" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 rounded disabled:opacity-40">Previous</button>
                <span id="pageIndicator">Page 1 of 1</span>
                <button id="nextPageBtn" onclick="changePage(1)" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 rounded disabled:opacity-40">Next</button>
            </div>

        </div>
    </div>

    <!-- Playlist / Xtream Codes Setup Modal -->
    <div id="playlistModal" class="hidden fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="px-4 py-3 bg-slate-800 border-b border-slate-700 flex justify-between items-center">
                <h3 class="font-semibold text-sm text-slate-100"><i class="fa-solid fa-folder-plus text-indigo-400 mr-2"></i>Load IPTV Playlist</h3>
                <button onclick="closeModal('playlistModal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="p-4 space-y-4 overflow-y-auto flex-1">
                <!-- Mode Selector -->
                <div class="flex border-b border-slate-800">
                    <button id="tabM3u" onclick="switchTab('m3u')" class="flex-1 pb-2 text-xs font-semibold text-indigo-400 border-b-2 border-indigo-500">M3U Link</button>
                    <button id="tabXtream" onclick="switchTab('xtream')" class="flex-1 pb-2 text-xs font-semibold text-slate-400 hover:text-slate-200">Xtream Codes</button>
                </div>

                <!-- M3U Link Panel -->
                <div id="panelM3u" class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">M3U Playlist URL</label>
                        <input type="url" id="m3uUrlInput" value="https://iptv-org.github.io/iptv/index.m3u" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                    <button onclick="loadM3uUrl()" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold transition">
                        Fetch M3U Playlist
                    </button>
                </div>

                <!-- Xtream Codes Panel -->
                <div id="panelXtream" class="hidden space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Server Address</label>
                        <input type="text" id="xcServer" placeholder="http://example.com:8080" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Username</label>
                        <input type="text" id="xcUser" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Password</label>
                        <input type="password" id="xcPass" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                    <button onclick="loadXtreamApi()" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold transition">
                        Connect Xtream Server
                    </button>
                </div>

                <div class="border-t border-slate-800 pt-3">
                    <button onclick="loadDefaultIptvOrg()" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs transition">
                        <i class="fa-solid fa-rotate-left mr-1"></i> Reset to Default Free IPTV-Org
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // State Management
        let allChannels = [];
        let filteredChannels = [];
        let favorites = JSON.parse(localStorage.getItem('sp_favs') || '[]');
        let currentChannel = null;
        let currentPage = 1;
        const itemsPerPage = 50;
        let hlsPlayer = null;
        let useProxy = false;
        const PROXY_URL = 'https://corsproxy.io/?';
        const SAFETY_CHANNEL_CAP = 2000;

        // Initialize Application
        document.addEventListener('DOMContentLoaded', () => {
            loadDefaultIptvOrg();
        });

        function loadDefaultIptvOrg() {
            const url = 'https://iptv-org.github.io/iptv/index.m3u';
            fetchM3U(url);
        }

        function switchTab(tab) {
            document.getElementById('panelM3u').classList.toggle('hidden', tab !== 'm3u');
            document.getElementById('panelXtream').classList.toggle('hidden', tab !== 'xtream');
            document.getElementById('tabM3u').className = tab === 'm3u' ? 'flex-1 pb-2 text-xs font-semibold text-indigo-400 border-b-2 border-indigo-500' : 'flex-1 pb-2 text-xs font-semibold text-slate-400 hover:text-slate-200';
            document.getElementById('tabXtream').className = tab === 'xtream' ? 'flex-1 pb-2 text-xs font-semibold text-indigo-400 border-b-2 border-indigo-500' : 'flex-1 pb-2 text-xs font-semibold text-slate-400 hover:text-slate-200';
        }

        function toggleProxy() {
            useProxy = !useProxy;
            document.getElementById('proxyStatus').innerText = useProxy ? 'Corsproxy.io' : 'Direct';
            document.getElementById('proxyBtn').classList.toggle('bg-emerald-950', useProxy);
            document.getElementById('proxyBtn').classList.toggle('border-emerald-700', useProxy);
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function hideError() {
            document.getElementById('errorLog').classList.add('hidden');
        }

        function showError(msg) {
            document.getElementById('errorLog').classList.remove('hidden');
            document.getElementById('errorMessage').innerText = msg;
        }

        async function fetchM3U(url) {
            hideError();
            document.getElementById('playerStatus').innerText = "Fetching playlist details...";
            closeModal('playlistModal');

            try {
                const targetUrl = useProxy ? PROXY_URL + encodeURIComponent(url) : url;
                const response = await fetch(targetUrl);
                if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
                const text = await response.text();
                parseM3UText(text);
            } catch (err) {
                showError(`Failed to load M3U: ${err.message}. If HTTPS/CORS restricts playback, toggle Proxy mode at top right.`);
                document.getElementById('playerStatus').innerText = "Failed to load playlist.";
            }
        }

        function loadM3uUrl() {
            const url = document.getElementById('m3uUrlInput').value.trim();
            if (url) fetchM3U(url);
        }

        function parseM3UText(text) {
            const lines = text.split('\n');
            let channels = [];
            let currentItem = {};

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    const nameMatch = line.match(/,(.+)$/);
                    const name = nameMatch ? nameMatch[1].trim() : 'Unnamed Channel';
                    
                    const groupMatch = line.match(/group-title="([^"]+)"/i);
                    const group = groupMatch ? groupMatch[1] : 'General';

                    const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
                    const logo = logoMatch ? logoMatch[1] : '';

                    currentItem = { name, group, logo };
                } else if (line.length > 0 && !line.startsWith('#')) {
                    currentItem.url = line;
                    channels.push(currentItem);
                    currentItem = {};
                    if (channels.length >= SAFETY_CHANNEL_CAP) break; // Memory safety cap for Tesla browser
                }
            }

            allChannels = channels;
            populateCategories();
            filterChannels();
            document.getElementById('playerStatus').innerText = `Loaded ${channels.length} channels. Click a channel to play.`;
        }

        async function loadXtreamApi() {
            const server = document.getElementById('xcServer').value.trim();
            const user = document.getElementById('xcUser').value.trim();
            const pass = document.getElementById('xcPass').value.trim();

            if (!server || !user || !pass) {
                alert("Please fill in all Xtream credentials");
                return;
            }

            hideError();
            closeModal('playlistModal');
            document.getElementById('playerStatus').innerText = "Connecting to Xtream API...";

            const cleanServer = server.endsWith('/') ? server.slice(0, -1) : server;
            const apiUrl = `${cleanServer}/player_api.php?username=${user}&password=${pass}&action=get_live_streams`;

            try {
                const targetUrl = useProxy ? PROXY_URL + encodeURIComponent(apiUrl) : apiUrl;
                const res = await fetch(targetUrl);
                const data = await res.json();
                
                if (Array.isArray(data)) {
                    allChannels = data.slice(0, SAFETY_CHANNEL_CAP).map(item => ({
                        name: item.name,
                        group: item.category_id || 'Xtream Stream',
                        logo: item.stream_icon || '',
                        url: `${cleanServer}/live/${user}/${pass}/${item.stream_id}.m3u8`
                    }));
                    populateCategories();
                    filterChannels();
                    document.getElementById('playerStatus').innerText = `Loaded ${allChannels.length} streams.`;
                } else {
                    throw new Error("Invalid response payload from server.");
                }
            } catch (err) {
                showError(`Xtream API Error: ${err.message}. Try toggling CORS Proxy mode.`);
            }
        }

        function populateCategories() {
            const catSelect = document.getElementById('categorySelect');
            const groups = [...new Set(allChannels.map(c => c.group))].sort();
            catSelect.innerHTML = '<option value="ALL">All Categories</option><option value="FAV">Favorites Only</option>';
            groups.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g;
                opt.innerText = g;
                catSelect.appendChild(opt);
            });
        }

        function filterChannels() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const cat = document.getElementById('categorySelect').value;

            filteredChannels = allChannels.filter(c => {
                const matchesSearch = c.name.toLowerCase().includes(search);
                const matchesFav = cat === 'FAV' ? favorites.includes(c.url) : true;
                const matchesCat = (cat === 'ALL' || cat === 'FAV') ? true : c.group === cat;
                return matchesSearch && matchesFav && matchesCat;
            });

            currentPage = 1;
            renderChannelGrid();
        }

        function renderChannelGrid() {
            const grid = document.getElementById('channelGrid');
            grid.innerHTML = '';

            const totalPages = Math.ceil(filteredChannels.length / itemsPerPage) || 1;
            document.getElementById('pageIndicator').innerText = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('channelCount').innerText = `${filteredChannels.length} Channels`;

            document.getElementById('prevPageBtn').disabled = currentPage === 1;
            document.getElementById('nextPageBtn').disabled = currentPage >= totalPages;

            const start = (currentPage - 1) * itemsPerPage;
            const pageChannels = filteredChannels.slice(start, start + itemsPerPage);

            pageChannels.forEach(ch => {
                const isFav = favorites.includes(ch.url);
                const card = document.createElement('div');
                card.className = "bg-slate-950 border border-slate-800 p-2.5 rounded-lg hover:border-indigo-500 cursor-pointer flex items-center justify-between transition group";
                card.onclick = () => playStream(ch);

                card.innerHTML = `
                    <div class="flex items-center space-x-2.5 overflow-hidden">
                        <div class="w-8 h-8 rounded bg-slate-900 border border-slate-800 flex items-center justify-center shrink-0 overflow-hidden">
                            ${ch.logo ? `<img src="${ch.logo}" class="w-full h-full object-cover" onerror="this.remove()">` : ''}
                            <i class="fa-solid fa-play text-xs text-indigo-400"></i>
                        </div>
                        <div class="truncate">
                            <h4 class="text-xs font-semibold text-slate-200 group-hover:text-indigo-400 truncate">${ch.name}</h4>
                            <p class="text-[10px] text-slate-400 truncate">${ch.group}</p>
                        </div>
                    </div>
                    <button onclick="event.stopPropagation(); toggleFavorite('${ch.url}')" class="text-slate-600 hover:text-amber-400 p-1">
                        <i class="${isFav ? 'fa-solid text-amber-400' : 'fa-regular'} fa-star text-xs"></i>
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        function changePage(delta) {
            currentPage += delta;
            renderChannelGrid();
        }

        function toggleFavorite(url) {
            if (favorites.includes(url)) {
                favorites = favorites.filter(f => f !== url);
            } else {
                favorites.push(url);
            }
            localStorage.setItem('sp_favs', JSON.stringify(favorites));
            filterChannels();
            updateFavCurrentBtn();
        }

        function toggleFavoriteCurrent() {
            if (currentChannel) toggleFavorite(currentChannel.url);
        }

        function updateFavCurrentBtn() {
            const btn = document.getElementById('favCurrentBtn');
            if (currentChannel && favorites.includes(currentChannel.url)) {
                btn.className = "text-amber-400 text-xl transition";
                btn.innerHTML = '<i class="fa-solid fa-star"></i>';
            } else {
                btn.className = "text-slate-600 hover:text-amber-400 text-xl transition";
                btn.innerHTML = '<i class="fa-regular fa-star"></i>';
            }
        }

        function playStream(ch) {
            hideError();
            currentChannel = ch;
            document.getElementById('currentChannelName').innerText = ch.name;
            document.getElementById('currentChannelCategory').innerText = ch.group;
            updateFavCurrentBtn();

            document.getElementById('playerOverlay').classList.remove('hidden');
            document.getElementById('playerStatus').innerText = "Connecting to stream...";

            const video = document.getElementById('videoPlayer');
            let streamUrl = ch.url;

            if (useProxy) {
                streamUrl = PROXY_URL + encodeURIComponent(streamUrl);
            }

            // Memory optimized HLS configuration for Tesla browser
            if (Hls.isSupported()) {
                if (hlsPlayer) {
                    hlsPlayer.destroy();
                }

                hlsPlayer = new Hls({
                    maxBufferLength: 10,           // Caps buffer at 10s to conserve Tesla RAM
                    maxMaxBufferLength: 20,
                    maxBufferSize: 10 * 1024 * 1024, // Hard limit RAM buffer to 10MB
                    enableWorker: false             // Prevents worker process crashes in Chromium
                });

                hlsPlayer.loadSource(streamUrl);
                hlsPlayer.attachMedia(video);

                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => {
                    document.getElementById('playerOverlay').classList.add('hidden');
                    video.play().catch(() => {});
                });

                hlsPlayer.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        showError(`Stream Error: Unable to play video segment. If on HTTPS, try enabling Proxy mode.`);
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', () => {
                    document.getElementById('playerOverlay').classList.add('hidden');
                    video.play();
                });
            } else {
                showError("HLS video playback is not supported in this browser.");
            }
        }
    </script>
</body>
</html>
