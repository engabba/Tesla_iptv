<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StreamPulse Offline IPTV Player</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HLS.js for stream playback -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body { height: 100%; overflow: hidden; background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body class="h-full flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-2 flex items-center justify-between shrink-0 h-12">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-tv text-indigo-500 text-xl"></i>
            <h1 class="font-bold text-base tracking-wide bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
                StreamPulse
            </h1>
        </div>
        <div class="flex items-center space-x-2">
            <!-- Upload JSON Button -->
            <button onclick="openModal('uploadModal')" class="px-2.5 py-1 text-xs font-semibold rounded bg-indigo-600 hover:bg-indigo-500 text-white transition flex items-center space-x-1.5">
                <i class="fa-solid fa-file-arrow-up text-xs"></i>
                <span>Update Channels</span>
            </button>
        </div>
    </header>

    <!-- Main Responsive Layout -->
    <div class="flex-1 flex flex-col lg:flex-row overflow-hidden min-h-0">
        
        <!-- Video Player Section -->
        <div class="w-full lg:w-3/5 flex flex-col bg-slate-950 border-b lg:border-b-0 lg:border-r border-slate-800 shrink-0 max-h-[40vh] lg:max-h-full">
            <div class="bg-black relative group flex-1 w-full h-full overflow-hidden flex items-center justify-center">
                <video id="videoPlayer" class="w-full h-full object-contain" controls autoplay playsinline></video>
                <div id="playerOverlay" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/80 p-4 text-center z-10">
                    <i id="playerIcon" class="fa-solid fa-play-circle text-4xl text-indigo-500 mb-2 animate-pulse"></i>
                    <p id="playerStatus" class="text-xs font-medium text-slate-300">Select a channel from the list to begin streaming</p>
                </div>
            </div>

            <!-- Current Stream Info Bar -->
            <div class="p-2 bg-slate-900 border-t border-slate-800 flex items-center justify-between shrink-0">
                <div class="truncate">
                    <h2 id="currentChannelName" class="font-bold text-xs text-slate-100 truncate">No Channel Selected</h2>
                    <p id="currentChannelCategory" class="text-[10px] text-slate-400 truncate">IPTV Offline Stream</p>
                </div>
                <button id="favCurrentBtn" onclick="toggleFavoriteCurrent()" class="text-slate-600 hover:text-amber-400 text-base transition px-2">
                    <i class="fa-star fa-regular"></i>
                </button>
            </div>

            <!-- Error Log -->
            <div id="errorLog" class="hidden p-2 bg-red-950/90 border-t border-red-800 text-red-200 text-[11px] shrink-0">
                <div class="flex items-center space-x-1.5">
                    <i class="fa-solid fa-circle-exclamation text-red-400 shrink-0"></i>
                    <div id="errorMessage" class="truncate">Error details will appear here.</div>
                </div>
            </div>
        </div>

        <!-- Channel List Section -->
        <div class="w-full lg:w-2/5 flex flex-col bg-slate-900 flex-1 min-h-0 overflow-hidden">
            
            <!-- Search & Filters -->
            <div class="p-2 bg-slate-900 border-b border-slate-800 flex flex-col space-y-1.5 shrink-0">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2 text-slate-500 text-[10px]"></i>
                    <input type="text" id="searchInput" oninput="filterChannels()" placeholder="Search channels..." class="w-full pl-7 pr-2 py-1 bg-slate-950 border border-slate-800 rounded text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
                
                <div class="flex items-center space-x-2">
                    <select id="categorySelect" onchange="filterChannels()" class="flex-1 bg-slate-950 border border-slate-800 rounded px-2 py-1 text-xs text-slate-300 focus:outline-none focus:border-indigo-500">
                        <option value="ALL">All Categories</option>
                        <option value="FAV">Favorites Only</option>
                    </select>
                    <span id="channelCount" class="text-[10px] text-slate-400 whitespace-nowrap">0 Channels</span>
                </div>
            </div>

            <!-- Channel Grid Scroll Area -->
            <div id="channelGrid" class="flex-1 overflow-y-auto p-2 space-y-1.5 min-h-0">
                <!-- Dynamic Channels Render Here -->
            </div>

            <!-- Pagination Controls -->
            <div class="p-2 bg-slate-900 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400 shrink-0">
                <button id="prevPageBtn" onclick="changePage(-1)" class="px-2.5 py-0.5 bg-slate-800 hover:bg-slate-700 rounded disabled:opacity-30">Prev</button>
                <span id="pageIndicator" class="text-[11px]">Page 1 of 1</span>
                <button id="nextPageBtn" onclick="changePage(1)" class="px-2.5 py-0.5 bg-slate-800 hover:bg-slate-700 rounded disabled:opacity-30">Next</button>
            </div>

        </div>
    </div>

    <!-- Update Channels Modal -->
    <div id="uploadModal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-xl shadow-2xl overflow-hidden flex flex-col">
            <div class="px-4 py-3 bg-slate-800 border-b border-slate-700 flex justify-between items-center">
                <h3 class="font-semibold text-xs text-slate-100"><i class="fa-solid fa-file-import text-indigo-400 mr-2"></i>Update Channel File</h3>
                <button onclick="closeModal('uploadModal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="p-4 space-y-4">
                <p class="text-xs text-slate-400">Select your updated <code class="text-indigo-300">my_channels.json</code> file generated by the extractor tool to update your channels.</p>
                
                <input type="file" id="jsonFileInput" accept=".json" class="block w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">

                <div class="border-t border-slate-800 pt-3 flex space-x-2">
                    <button onclick="loadUploadedFile()" class="flex-1 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded text-xs font-semibold transition">
                        Import & Save
                    </button>
                    <button onclick="clearSavedData()" class="py-1.5 px-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs transition">
                        Reset Default
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        let allChannels = [];
        let filteredChannels = [];
        let favorites = JSON.parse(localStorage.getItem('sp_favs') || '[]');
        let currentChannel = null;
        let currentPage = 1;
        const itemsPerPage = 40;
        let hlsPlayer = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadChannels();
        });

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function hideError() { document.getElementById('errorLog').classList.add('hidden'); }
        function showError(msg) {
            document.getElementById('errorLog').classList.remove('hidden');
            document.getElementById('errorMessage').innerText = msg;
        }

        async function loadChannels() {
            // Priority 1: Check browser LocalStorage for imported JSON file
            const storedJSON = localStorage.getItem('sp_my_channels');
            if (storedJSON) {
                try {
                    allChannels = JSON.parse(storedJSON);
                    populateCategories();
                    filterChannels();
                    document.getElementById('playerStatus').innerText = `Loaded ${allChannels.length} channels from local memory.`;
                    return;
                } catch(e) {}
            }

            // Priority 2: Fetch default repository my_channels.json file
            try {
                const res = await fetch('my_channels.json');
                if (res.ok) {
                    allChannels = await res.json();
                    populateCategories();
                    filterChannels();
                    document.getElementById('playerStatus').innerText = `Loaded ${allChannels.length} channels from repository.`;
                } else {
                    showError("No channel data found. Click 'Update Channels' to upload your my_channels.json file.");
                }
            } catch (err) {
                showError("Upload your extracted my_channels.json file to begin viewing channels.");
            }
        }

        function loadUploadedFile() {
            const input = document.getElementById('jsonFileInput');
            if (!input.files || input.files.length === 0) {
                alert("Please select a valid my_channels.json file.");
                return;
            }

            const file = input.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (Array.isArray(parsed)) {
                        allChannels = parsed;
                        localStorage.setItem('sp_my_channels', JSON.stringify(parsed));
                        populateCategories();
                        filterChannels();
                        closeModal('uploadModal');
                        document.getElementById('playerStatus').innerText = `Successfully loaded and saved ${allChannels.length} channels.`;
                    } else {
                        alert("Invalid JSON format. Please use the file generated by extractor.html");
                    }
                } catch(err) {
                    alert("Error reading JSON file.");
                }
            };

            reader.readAsText(file);
        }

        function clearSavedData() {
            localStorage.removeItem('sp_my_channels');
            closeModal('uploadModal');
            loadChannels();
        }

        function populateCategories() {
            const catSelect = document.getElementById('categorySelect');
            const groups = [...new Set(allChannels.map(c => c.group))].sort();
            catSelect.innerHTML = '<option value="ALL">All Categories</option><option value="FAV">Favorites Only</option>';
            groups.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g;
                opt.innerText = g;
                catSelect.appendChild(opt);
            });
        }

        function filterChannels() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const cat = document.getElementById('categorySelect').value;

            filteredChannels = allChannels.filter(c => {
                const matchesSearch = c.name.toLowerCase().includes(search);
                const matchesFav = cat === 'FAV' ? favorites.includes(c.url) : true;
                const matchesCat = (cat === 'ALL' || cat === 'FAV') ? true : c.group === cat;
                return matchesSearch && matchesFav && matchesCat;
            });

            currentPage = 1;
            renderChannelGrid();
        }

        function renderChannelGrid() {
            const grid = document.getElementById('channelGrid');
            grid.innerHTML = '';

            const totalPages = Math.ceil(filteredChannels.length / itemsPerPage) || 1;
            document.getElementById('pageIndicator').innerText = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('channelCount').innerText = `${filteredChannels.length} Channels`;

            document.getElementById('prevPageBtn').disabled = currentPage === 1;
            document.getElementById('nextPageBtn').disabled = currentPage >= totalPages;

            const start = (currentPage - 1) * itemsPerPage;
            const pageChannels = filteredChannels.slice(start, start + itemsPerPage);

            pageChannels.forEach(ch => {
                const isFav = favorites.includes(ch.url);
                const card = document.createElement('div');
                card.className = "bg-slate-950 border border-slate-800 p-2 rounded hover:border-indigo-500 cursor-pointer flex items-center justify-between transition group";
                card.onclick = () => playStream(ch);

                card.innerHTML = `
                    <div class="flex items-center space-x-2 overflow-hidden">
                        <div class="w-6 h-6 rounded bg-slate-900 border border-slate-800 flex items-center justify-center shrink-0 overflow-hidden">
                            ${ch.logo ? `<img src="${ch.logo}" class="w-full h-full object-cover" onerror="this.remove()">` : ''}
                            <i class="fa-solid fa-play text-[10px] text-indigo-400"></i>
                        </div>
                        <div class="truncate">
                            <h4 class="text-xs font-semibold text-slate-200 group-hover:text-indigo-400 truncate">${ch.name}</h4>
                            <p class="text-[9px] text-slate-400 truncate">${ch.group}</p>
                        </div>
                    </div>
                    <button onclick="event.stopPropagation(); toggleFavorite('${ch.url}')" class="text-slate-600 hover:text-amber-400 p-1">
                        <i class="${isFav ? 'fa-solid text-amber-400' : 'fa-regular'} fa-star text-xs"></i>
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        function changePage(delta) {
            currentPage += delta;
            renderChannelGrid();
        }

        function toggleFavorite(url) {
            if (favorites.includes(url)) {
                favorites = favorites.filter(f => f !== url);
            } else {
                favorites.push(url);
            }
            localStorage.setItem('sp_favs', JSON.stringify(favorites));
            filterChannels();
            updateFavCurrentBtn();
        }

        function toggleFavoriteCurrent() {
            if (currentChannel) toggleFavorite(currentChannel.url);
        }

        function updateFavCurrentBtn() {
            const btn = document.getElementById('favCurrentBtn');
            if (currentChannel && favorites.includes(currentChannel.url)) {
                btn.className = "text-amber-400 text-base transition px-2";
                btn.innerHTML = '<i class="fa-solid fa-star"></i>';
            } else {
                btn.className = "text-slate-600 hover:text-amber-400 text-base transition px-2";
                btn.innerHTML = '<i class="fa-regular fa-star"></i>';
            }
        }

        function playStream(ch) {
            hideError();
            currentChannel = ch;
            document.getElementById('currentChannelName').innerText = ch.name;
            document.getElementById('currentChannelCategory').innerText = ch.group;
            updateFavCurrentBtn();

            document.getElementById('playerOverlay').classList.remove('hidden');
            document.getElementById('playerStatus').innerText = "Connecting to stream...";

            const video = document.getElementById('videoPlayer');
            let streamUrl = ch.url;

            if (Hls.isSupported()) {
                if (hlsPlayer) {
                    hlsPlayer.destroy();
                }

                hlsPlayer = new Hls({
                    maxBufferLength: 10,
                    maxMaxBufferLength: 20,
                    maxBufferSize: 10 * 1024 * 1024,
                    enableWorker: false
                });

                hlsPlayer.loadSource(streamUrl);
                hlsPlayer.attachMedia(video);

                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => {
                    document.getElementById('playerOverlay').classList.add('hidden');
                    video.play().catch(() => {});
                });

                hlsPlayer.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        showError("Unable to play stream. The stream link may be offline or restricted by CORS.");
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', () => {
                    document.getElementById('playerOverlay').classList.add('hidden');
                    video.play();
                });
            }
        }
    </script>
</body>
</html>
